# /etc/nginx/sites-available/acessowifi
server {
    listen 443 ssl;
    server_name wifi.suaempresa.local;

    ssl_certificate     /etc/ssl/acessowifi/cert.pem;
    ssl_certificate_key /etc/ssl/acessowifi/key.pem;

    # Opcional: liberar só para a rede interna
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
