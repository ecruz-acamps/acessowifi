# =====================================================================
#  Acesso Wi-Fi: configuração do FortiGate 40F (FortiOS 7.2)
#
#  Normalmente NÃO é preciso usar este arquivo: o instalador (modo automático)
#  faz tudo isto por SSH. Use-o só no modo manual. Explicação em docs/FORTIGATE.md.
#
#  Como usar:
#   1. Troque 192.168.1.50 pelo IP do servidor onde o painel vai rodar.
#   2. Cole os blocos 1 a 5 na CLI do FortiGate (GUI > ícone ">_" no topo, ou SSH).
#   3. O último comando do bloco 5 mostra o TOKEN ("New API key: ...").
#      Copie na hora, porque ele não aparece de novo. O instalador do painel vai pedir esse token.
#   4. Faça o bloco 6 (SSID) com calma, de preferência pela GUI.
# =====================================================================

# --- 1. Grupo de visitantes onde o painel cadastra os usuários (com validade) ---
config user group
    edit "WiFi-Cadastrados"
        set group-type guest
        set user-id specify
        set password specify
        set user-name enable
        set email enable
        set mobile-phone enable
        set company optional
        set sponsor optional
        set expire-type immediately
    next
end

# --- 2. Grupo de endereços para "Permitir sempre" (liberação por MAC) ---
#     O FortiOS não aceita grupo vazio; o endereço fictício abaixo NÃO deve ser removido.
config firewall address
    edit "WiFi-MAC-placeholder"
        set type mac
        set macaddr 02:00:00:00:00:00
        set comment "Nao remover: mantem o grupo WiFi-MAC-Liberados nao vazio"
    next
end
config firewall addrgrp
    edit "WiFi-MAC-Liberados"
        set member "WiFi-MAC-placeholder"
    next
end
config user security-exempt-list
    edit "WiFi-Liberados"
        config rule
            edit 1
                set srcaddr "WiFi-MAC-Liberados"
            next
        end
    next
end

# --- 3. Perfil de permissões do token da API ---
config system accprofile
    edit "api-acessowifi"
        set authgrp read-write
        set wifi read
        set fwgrp custom
        config fwgrp-permission
            set address read-write
            set policy read
        end
    next
end

# --- 4. Sessão do captive portal com tempo máximo (recomendado) ---
#     Quando uma conta vence ou é removida, quem já estava logado é desconectado em até 4 h.
config user setting
    set auth-timeout 240
    set auth-timeout-type hard-timeout
end

# --- 5. Admin da API (troque o IP pelo do servidor do painel) ---
config system api-user
    edit "acessowifi"
        set comments "Painel Acesso Wi-Fi"
        set accprofile "api-acessowifi"
        set vdom "root"
        config trusthost
            edit 1
                set ipv4-trusthost 192.168.1.50 255.255.255.255
            next
        end
    next
end
execute api-user generate-key acessowifi

# --- 6. SSID do captive portal ---
#     Mais seguro pela GUI: WiFi & Switch Controller > SSIDs > (seu SSID) >
#       - User Groups: adicione "WiFi-Cadastrados" (mantenha o grupo do Google)
#       - Exempt sources: "WiFi-MAC-Liberados"
#
#     Pela CLI: veja antes como está ("show wireless-controller vap NOME_DO_SSID").
#     "append" adiciona o grupo sem tirar o do Google. Se já existir um
#     security-exempt-list, inclua a regra nele em vez de trocar.
#
# config wireless-controller vap
#     edit "NOME_DO_SSID"
#         append selected-usergroups "WiFi-Cadastrados"
#         set security-exempt-list "WiFi-Liberados"
#     next
# end
#
#     Confira também a política de firewall do SSID para a internet: se ela exigir
#     grupos de usuário na origem, crie uma política acima dela com origem
#     "WiFi-MAC-Liberados" (sem usuário), senão os aparelhos liberados não navegam.
#
#     Se a interface que o servidor usa para falar com o FortiGate não tiver HTTPS
#     de administração habilitado:  config system interface > edit <porta> >
#     append allowaccess https
