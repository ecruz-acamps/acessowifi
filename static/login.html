<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d6232a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Acesso Wi-Fi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title>Acesso Wi-Fi — Entrar</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <form method="post" action="/login" class="login-card">
    <h1>Acesso Wi-Fi</h1>
    <p id="login-error" class="error" hidden>Usuário ou senha inválidos.</p>
    <label>Usuário <input name="user" autocomplete="username" required autofocus></label>
    <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Entrar</button>
    <p class="muted small-note"><a href="/certificado">Instalar o certificado e o app</a></p>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("erro"))
      document.getElementById("login-error").hidden = false;
  </script>
  <script src="/static/pwa.js"></script>
</body>
</html>
